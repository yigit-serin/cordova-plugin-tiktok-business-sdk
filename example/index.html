<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TikTok Business SDK Example</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .status {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .section {
            margin-bottom: 30px;
        }

        .section h2 {
            color: #333;
            font-size: 18px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            color: #555;
            font-size: 14px;
            margin-bottom: 5px;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 10px;
        }

        button:active {
            transform: scale(0.98);
        }

        button:hover {
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button.secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        button.danger {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }

        .log {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }

        .log-entry {
            margin-bottom: 8px;
            padding: 5px;
            border-left: 3px solid #667eea;
            padding-left: 10px;
        }

        .log-entry.error {
            border-left-color: #dc3545;
            color: #dc3545;
        }

        .log-entry.success {
            border-left-color: #28a745;
            color: #28a745;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 TikTok Business SDK</h1>
        <p class="subtitle">Cordova Plugin Example</p>

        <div id="status" class="status info">
            Waiting for device ready...
        </div>

        <!-- SDK Initialization -->
        <div class="section">
            <h2>1. Initialize SDK</h2>
            <div class="input-group">
                <label for="accessToken">Access Token</label>
                <input type="text" id="accessToken" placeholder="Enter your access token">
            </div>
            <div class="input-group">
                <label for="appId">App ID</label>
                <input type="text" id="appId" placeholder="Enter your app ID">
            </div>
            <div class="input-group">
                <label for="ttAppId">TikTok App ID</label>
                <input type="text" id="ttAppId" placeholder="Enter your TikTok app ID">
            </div>
            <button id="initBtn">Initialize SDK</button>
        </div>

        <!-- User Identity -->
        <div class="section">
            <h2>2. Set User Identity</h2>
            <div class="input-group">
                <label for="userId">User ID</label>
                <input type="text" id="userId" placeholder="user_123">
            </div>
            <div class="input-group">
                <label for="userName">Username</label>
                <input type="text" id="userName" placeholder="john_doe">
            </div>
            <div class="input-group">
                <label for="userEmail">Email</label>
                <input type="email" id="userEmail" placeholder="user@example.com">
            </div>
            <button id="identifyBtn" class="secondary">Set Identity</button>
        </div>

        <!-- Event Tracking -->
        <div class="section">
            <h2>3. Track Events</h2>
            <div class="input-group">
                <label for="eventType">Event Type</label>
                <select id="eventType">
                    <option value="LOGIN">Login</option>
                    <option value="REGISTRATION">Registration</option>
                    <option value="ADD_PAYMENT_INFO">Add Payment Info</option>
                    <option value="COMPLETE_TUTORIAL">Complete Tutorial</option>
                    <option value="ACHIEVE_LEVEL">Achieve Level</option>
                    <option value="SEARCH">Search</option>
                    <option value="SUBSCRIBE">Subscribe</option>
                </select>
            </div>
            <button id="trackBtn" class="secondary">Track Event</button>
        </div>

        <!-- Logout -->
        <div class="section">
            <h2>4. Logout</h2>
            <button id="logoutBtn" class="danger">Logout User</button>
        </div>

        <!-- Activity Log -->
        <div class="section">
            <h2>Activity Log</h2>
            <div id="log" class="log">
                <div class="log-entry">Ready to start...</div>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="cordova.js"></script>
    <script type="text/javascript" src="js/index.js"></script>
</body>
</html>
